[project]
name = "azienda"
version = "0.1.0"
description = "Azienda — the AI Business OS. Business applications, run by agents, governed by policy."
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.126",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "asyncpg>=0.29",
  "pgvector>=0.3",
  "redis>=5.0",
  "arq>=0.26",
  "structlog>=24.0",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-instrumentation-fastapi>=0.48",
  "litellm>=1.60",
  "langgraph>=1.0",
  "mcp>=1.27,<2",
  "fastmcp>=2.0",
  "pyjwt>=2.10",
  "passlib[bcrypt]>=1.7",
  "httpx>=0.27",
  "typer>=0.12",
  "python-multipart>=0.0.18",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

# B008 flags Depends() in endpoint defaults, which is the canonical FastAPI
# dependency-injection idiom used by every router in this repo. Silencing it
# for the API layer only; S105/S107 are false positives on test fixtures.
[tool.ruff.lint.per-file-ignores]
"app/api/**/*.py" = ["B008"]
"app/cli/**/*.py" = ["B008"]
"tests/**/*.py" = ["S105", "S107", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
